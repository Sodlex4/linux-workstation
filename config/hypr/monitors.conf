# Shared fallback monitor configuration.
# Machine-specific overrides live in machine/<slot>/monitors.conf
# (e.g. machine/HP_EliteBook_840_G3/monitors.conf) and are symlinked
# on top of this file during install.sh.
# 
# If no machine-specific config exists for this hardware,
# this generic config is used as a fallback.

env = GDK_SCALE,1
monitor=,preferred,auto,1
