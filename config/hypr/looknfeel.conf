# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Subtle rounded corners
    rounding = 6

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15

    # Blur enabled via Omarchy defaults (size=2, passes=2)
    # Remove this block to restore default blur
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    # Disable all animations for stability on Intel GPU
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Variables/#group
# Override broken Omarchy defaults — Hyprland 0.55 removed -1 as valid color
group {
    col.border_locked_active = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}
