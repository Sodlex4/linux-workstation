# hyprpaper.conf v0.8.4+ (hyprlang block format)
# Uses the omarchy theme background directory directly.

# Wallpaper for laptop display (eDP-1)
wallpaper {
    monitor = eDP-1
    path = /home/sodlex/.config/omarchy/current/theme/backgrounds/0-ship-at-sea.jpg
    fit_mode = cover
}

# Fallback for any other monitors
wallpaper {
    monitor =
    path = /home/sodlex/.config/omarchy/current/theme/backgrounds/0-ship-at-sea.jpg
    fit_mode = cover
}

# Splash text on wallpaper (default: off)
splash = false

# Enable IPC (default: on)
ipc = true
