# HP Laptop — monitor configuration
# Run `hyprctl monitors` on the HP to get port, resolution, and refresh rate.
# See https://wiki.hyprland.org/Configuring/Monitors/
#
# Example for Framework 13:
#   monitor = eDP-1, 2880x1920@120, auto, 2
#   env = GDK_SCALE,2

env = GDK_SCALE,1
monitor=,preferred,auto,1
