#? Config file for btop

#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and "TTY" for builtin themes.
#* Themes should be placed in "../share/btop/themes" relative to binary or "$HOME/.config/btop/themes"
color_theme = "current"

#* If the theme set background should be shown, set to False if you want terminal background transparency.
theme_background = False

#* Sets if 24-bit truecolor should be used, will convert 24-bit colors to 256 color (6x6x6 color cube) if false.
truecolor = True

#* Set to true to force tty mode regardless if a real tty has been detected or not.
#* Will force 16-color mode and TTY theme, set all graph symbols to "tty" and swap out other non tty friendly symbols.
force_tty = False

#* Define presets for the layout of the boxes. Preset 0 is always all boxes shown with default settings. Max 9 presets.
#* Format: "box_name:P:G,box_name:P:G" P=(0 or 1) for alternate positions, G=graph symbol to use for box.
#* Use whitespace " " as separator between different presets.
#* Example: "cpu:0:default,mem:0:tty,proc:1:default cpu:0:braille,proc:0:tty"
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"

#* Set to True to enable "h,j,k,l,g,G" keys for directional control in lists.
#* Conflicting keys for h:"help" and k:"kill" is accessible while holding shift.
vim_keys = True

#* Rounded corners on boxes, is ignored if TTY mode is ON.
rounded_corners = True

#* Default symbols to use for graph creation, "braille", "block" or "tty".
graph_symbol = "braille"

#* Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
graph_symbol_cpu = "default"

#* Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
graph_symbol_mem = "default"

#* Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
graph_symbol_net = "default"

#* Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
graph_symbol_proc = "default"

#* Manually set which boxes to show, available boxes: "cpu", "mem", "net", "proc", "empty".
#* Use a space as separator. If empty, the default is used.
shown_boxes = "cpu mem proc"

#* Update time in milliseconds, recommended 2000 ms or above for better performance.
update_ms = 2000

#* Use /proc/self/mem instead of /proc/self/stat, may work better for some non-linux OSes but is slower.
use_old_mem_free = False

#* Use asynchronous loading of, look of /proc/self/stat, may be slower but gives more accurate memory usage.
mem_async_loading = False

#* Number of ms between reading GPU stats, can be higher for better performance.
gpu_update_ms = 10000

#* Use psutil for process information on Linux, may be slower but gives more accurate process stats.
proc_use_psutil = False

#* Turn on/off caching for process tree.
proc_tree_cache = True

#* How many processes to show, set to 0 for all. Has negligible performance impact with the new incremental searching.
proc_per_page = 50

#* Show processes as a tree, set to False to sort.
proc_tree = True

#* Depth of the tree, 0 for unlimited.
proc_tree_depth = 0

#* Show process tree collapsed by default.
proc_tree_collapsed = False

#* Depth of tree at startup, 0 for showing all.
proc_tree_start_depth = 3

#* Use dots for tree, default is "default", set to "none" to only use lines.
proc_tree_use_dots = True

#* How to sort processes, "pid", "program", "arguments", "state", "cpu", "mem_percent", "mem_bytes", "threads", "processs", "user", "time", "read", "write", "total_read_write".
proc_sorting = "cpu"

#* Reverse sorting order, default is True for "cpu" and "cpu" responsive, if set to False will sort descending.
proc_reversed = True

#* Show all processes, or only selected modes: "tree", "all", "own".
proc_filtering = "all"

#* Show processes as their username, or "default" to only show the user column if not current user.
proc_show_users = False

#* Show graphical gauge for CPU and memory usage per process.
proc_gradient = True

#* If process cpu usage should be of the core it's running on or average of all cores.
proc_per_core = True

#* Show process memory in bytes instead of percent.
proc_mem_bytes = True

#* Number of seconds to wait before detecting the process as "killed", should be above 1.
proc_info_smaps = False

#* Show left info column in process box.
proc_left = True

#* Show filtering info in process box.
proc_filter = True

#* Number of seconds to wait before detecting the process as "killed", should be above 1.
proc_aggregate_core = True

#* Use cpu average for temp and frequency, set to False to use per core.
cpu_single_graph = False

#* Show temperature for cpu, "null" to disable.
cpu_temp_show = True

#* Show temperature for cpu in a gauge or "text" for just text.
cpu_temp_in_gauge = True

#* Show cpu temperature in a gauge, "null" to disable.
cpu_temp_low = 50

#* CPU temperature shown as medium if between low and high.
cpu_temp_medium = 75

#* CPU temperature shown as high if above medium.
cpu_temp_high = 85

#* Show cpu frequency, "null" to disable.
cpu_freq_show = True

#* Draw average cpu frequency in the cpu box.
cpu_freq_avg = True

#* Show the core that is the main bottleneck, based on frequency scaling.
cpu_freq_bottleneck = True

#* Show the core with the highest temp in the cpu box.
cpu_core_map = False

#* Show detailed cpu core info in the cpu box.
cpu_details = False

#* Show the memory box.
mem_show = True

#* Show swap info in the memory box.
mem_show_swap = True

#* Show swap info in the memory box.
mem_show_disks = True

#* Show memory values in bytes.
mem_bytes = True

#* Show the network box.
net_show = True

#* Restrict network usage to the selected network interface, "null" to show all.
net_iface = "null"

#* Sync auto scaling for network graphs.
net_auto = True

#* Sync sync bytes, set to False for bits.
net_sync = True

#* Show bps/s or B/s in the network box, set to True to show bps/s.
net_bits = False

#* Show notifications for new processes.
proc_notification = False

#* Show notification if a process is killed.
proc_killed_notification = False

#* Number of ms between checking for new processes.
proc_new_check_ms = 5000

#* Check for new processes and show notifications.
proc_new_notification = False

#* Show a notification if a new process has higher cpu usage than this value.
proc_new_cpu_notification_percent = 10

#* Show a notification if a new process has higher memory usage than this value.
proc_new_mem_notification_percent = 10

#* Enable check for kill and new process notifications.
proc_kill_notification = False

#* Show a notification if a process is killed that uses more cpu than this value.
proc_kill_cpu_notification_percent = 10

#* Show a notification if a process that uses more memory than this value is killed.
proc_kill_mem_notification_percent = 10

#* Show a notification if a process is killed.
proc_exit_notification = False

#* Show a notification if a process exits that uses more cpu than this value.
proc_exit_cpu_notification_percent = 10

#* Show a notification if a process that uses more memory than this value exits.
proc_exit_mem_notification_percent = 10

#* Show a notification if a process is spawned.
proc_spawn_notification = False

#* Show a notification if a process is spawned that uses more cpu than this value.
proc_spawn_cpu_notification_percent = 10

#* Show a notification if a process that uses more memory than this value is spawned.
proc_spawn_mem_notification_percent = 10

#* Enable time column clock.
proc_show_clock = True

#* Number of clock seconds to show.
proc_clock_seconds = True

#* Show the battery box.
battery_show = True

#* Select between "detailed" and "bar" for battery box.
battery_display = "detailed"

#* Show the clock.
clock_show = True

#* Clock format, uses same as date command.
clock_format = "%H:%M"

#* Background update time in seconds.
bg_update_ms = 500

#* Custom cpu model name, set to "null" to use default.
custom_cpu_name = "null"

#* Custom hostname, set to "null" to use default.
custom_hostname = "null"

#* Path to btop themes, default is "../share/btop/themes" relative to binary or "$HOME/.config/btop/themes".
theme_location = "themes"

#* Log level, "disabled", "error", "warning", "info", "debug". Default is "error".
log_level = "disabled"
